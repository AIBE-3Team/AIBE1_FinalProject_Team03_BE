services:
  redis-cache:
    image: redis:7.0-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300
    volumes:
      - redis-data:/data
    networks:
      - k6-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=48h'  # 48시간으로 증가
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
      - '--storage.tsdb.max-block-duration=2h'  # 블록 크기 최적화
      - '--storage.tsdb.min-block-duration=5m'
    networks:
      - k6-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_USER=admin
      - TZ=Asia/Seoul
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - k6-network

  aws-seat-test:
    image: grafana/k6:latest
    container_name: aws-seat-test
    restart: "no"
    profiles: ["seat-test"]
    volumes:
      - ./scripts:/scripts:ro
    command: >
      run --out experimental-prometheus-rw
      --tag testType=seat-reservation
      --tag scenario=seat-load-100
      --summary-trend-stats="min,avg,med,max,p(90),p(95),p(99)"
      --verbose
      --no-connection-reuse
      --batch=50
      --batch-per-host=20
      /scripts/aws-seat-reservation-load-test.js
    environment:
      - TOTAL_USERS=100
      - CONCURRENT_USERS=100
      - CONCERT_ID=113
      - SEAT_COUNT=60
      - BASE_URL=http://${AWS_EC2_PUBLIC_IP}:8080/api
      - WS_BASE_URL=ws://${AWS_EC2_PUBLIC_IP}:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=10s
      - K6_PROMETHEUS_RW_STALE_MARKERS=true
      - K6_NO_CONNECTION_REUSE=true
      - K6_BATCH_SIZE=30                    # 배치 크기 명시
      - REDIS_URL=rediss://valkey-114f18b1-testube604-6eea.l.aivencloud.com:24955
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    depends_on:
      - prometheus
    networks:
      - k6-network