services:
  redis-cache:
    image: redis:7.0-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300
    volumes:
      - redis-data:/data
    networks:
      - k6-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=48h'  # 48시간으로 증가
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
      - '--storage.tsdb.max-block-duration=2h'  # 블록 크기 최적화
      - '--storage.tsdb.min-block-duration=5m'
    networks:
      - k6-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_USER=admin
      - TZ=Asia/Seoul
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - k6-network

  # 좌석 선점 부하테스트 (기존 패턴과 동일하게)
  k6-seat-test:
    image: grafana/k6:latest
    container_name: k6-seat-test
    restart: "no"
    profiles: ["seat-test"]
    volumes:
      - ./scripts:/scripts:ro  # scripts 폴더 전체를 마운트
    command: >
      run --out experimental-prometheus-rw
      --tag testType=seat-reservation
      --tag scenario=seat-load-100
      --summary-trend-stats="min,avg,med,max,p(90),p(95),p(99)"
      --verbose
      --no-connection-reuse
      --batch=50
      --batch-per-host=20
      /scripts/SeatLoadTest.js
    environment:
      # 🎯 좌석 선점 테스트 설정 (기존 패턴 동일)
      - TOTAL_USERS=50            # 100명 동시 사용자
      - CONCURRENT_USERS=50       # 최대 100명
      - RAMP_UP_DURATION=60s       # 1분에 걸쳐 증가
      - TEST_DURATION=5m           # 5분간 안정적으로 유지
      - COOL_DOWN_DURATION=30s     # 1분에 걸쳐 감소
      - CONCERT_ID=153               # 좌석 선점 테스트용 콘서트 ID
      - SEAT_COUNT=30             # 좌석 개수
      - BASE_URL=http://host.docker.internal:8080/api
      - WS_BASE_URL=ws://host.docker.internal:8080
      # Prometheus 설정 (기존과 동일)
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=10s     # 10초마다 전송
      - K6_PROMETHEUS_RW_STALE_MARKERS=true    # 안정성 향상
      - K6_NO_CONNECTION_REUSE=true            # 연결 재사용 비활성화
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    depends_on:
      - prometheus
    networks:
      - k6-network

  aws-seat-test:
    image: grafana/k6:latest
    container_name: aws-seat-test
    restart: "no"
    profiles: ["seat-test"]
    volumes:
      - ./scripts:/scripts:ro
    command: >
      run --out experimental-prometheus-rw
      --tag testType=seat-reservation
      --tag scenario=seat-load-100
      --summary-trend-stats="min,avg,med,max,p(90),p(95),p(99)"
      --verbose
      --no-connection-reuse
      --batch=50
      --batch-per-host=20
      /scripts/aws-seat-reservation-load-test.js
    environment:
      - TOTAL_USERS=100
      - CONCURRENT_USERS=100
      - CONCERT_ID=113
      - SEAT_COUNT=60
      - BASE_URL=http://host.docker.internal:8080/api
      - WS_BASE_URL=ws://host.docker.internal:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=10s
      - K6_PROMETHEUS_RW_STALE_MARKERS=true
      - K6_NO_CONNECTION_REUSE=true
      - K6_BATCH_SIZE=30                    # 배치 크기 명시
      - REDIS_URL=rediss://valkey-114f18b1-testube604-6eea.l.aivencloud.com:24955
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    depends_on:
      - prometheus
    networks:
      - k6-network



  k6-loadtest:
    image: grafana/k6:latest
    container_name: k6-seat-test
    restart: "no"
    profiles: ["seat-test"]
    volumes:
      - ./scripts:/scripts:ro
    command: >
      run --out experimental-prometheus-rw
      --tag testType=ticketing
      --tag scenario=stable-500
      --summary-trend-stats="min,avg,med,max,p(90),p(95),p(99)"
      --verbose
      --no-connection-reuse
      --batch=10
      --batch-per-host=5
      /scripts/ConcurrentLoadTest.js
    environment:
      - TOTAL_USERS=500            # 200명 동시 사용자 (성공 확인됨)
      - CONCURRENT_USERS=100        # 50명씩 4단계로 나누어
      - RAMP_UP_DURATION=300s      # 4분에 걸쳐 천천히 증가
      - TEST_DURATION=10m           # 8분간 안정적으로 유지
      - COOL_DOWN_DURATION=180s    # 2분에 걸쳐 천천히 감소
      - CONCERT_ID=113
      - BASE_URL=http://host.docker.internal:8080/api
      - WS_URL=ws://host.docker.internal:8080/ws/waitqueue
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=5s     # 5초마다 전송 (데이터 수집 개선)
      - K6_PROMETHEUS_RW_STALE_MARKERS=true   # 안정성 향상
      - K6_WS_COMPRESSION=false               # WebSocket 압축 비활성화
      - K6_NO_CONNECTION_REUSE=true           # 연결 재사용 비활성화
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    depends_on:
      - prometheus
    networks:
      - k6-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  k6-network:
    driver: bridge

# 🚀 좌석 선점 테스트 실행 방법:
#
# 1. 인프라 시작:
#    docker-compose up -d prometheus grafana redis-cache
#
# 2. 좌석 선점 부하테스트:
#    docker-compose --profile seat-test up k6-seat-test
#
# 3. 기존 대기열 테스트:
#    docker-compose --profile load-test up k6-loadtest