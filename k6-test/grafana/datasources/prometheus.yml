apiVersion: 1

datasources:
  # 📊 Prometheus 데이터소스 (k6 메트릭용)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: false
    editable: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.40.0

  # 🎯 InfluxDB 데이터소스 (선택사항 - k6 직접 연결시)
  - name: InfluxDB-k6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    basicAuth: false
    editable: true
    jsonData:
      version: Flux
      organization: k6-org
      defaultBucket: k6-bucket
      tlsSkipVerify: false
    secureJsonData:
      token: k6-token-super-secret